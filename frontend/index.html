<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tndrr-mark.png" />
    <link rel="apple-touch-icon" href="/tndrr-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="tndrr | Every tender. One search. Public procurement intelligence and government tender analytics across J&K, Ladakh, Punjab, and Himachal Pradesh." />
    <title>tndrr | Every Tender. One Search.</title>
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Social preview defaults (overwritten per page by src/hooks/useSeo.js) -->
    <meta property="og:site_name" content="tndrr" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="tndrr | Every Tender. One Search." />

    <!-- Site-wide structured data: brand identity and sitelinks search box -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.tndrr.com/#organization",
            "name": "tndrr",
            "url": "https://www.tndrr.com/",
            "logo": "https://www.tndrr.com/tndrr-logo.png",
            "description": "Government tender search and procurement intelligence for Jammu & Kashmir, Ladakh, Punjab, Himachal Pradesh, Haryana and Delhi."
          },
          {
            "@type": "WebSite",
            "@id": "https://www.tndrr.com/#website",
            "name": "tndrr",
            "url": "https://www.tndrr.com/",
            "publisher": { "@id": "https://www.tndrr.com/#organization" },
            "inLanguage": "en-IN",
            "potentialAction": {
              "@type": "SearchAction",
              "target": { "@type": "EntryPoint", "urlTemplate": "https://www.tndrr.com/tenders?search={search_term_string}" },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
