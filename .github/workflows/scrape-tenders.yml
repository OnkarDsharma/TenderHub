name: Automated 6-Slot Multi-State Tender Ingestion

on:
  schedule:
    # Fallback only: off-peak minutes ~20m after each slot, avoiding :00 and :30
    - cron: '50 2 * * *'   # 08:20 AM IST (Slot 1 Fallback)
    - cron: '50 4 * * *'   # 10:20 AM IST (Slot 2 Fallback)
    - cron: '20 7 * * *'   # 12:50 PM IST (Slot 3 Fallback)
    - cron: '50 9 * * *'   # 03:20 PM IST (Slot 4 Fallback)
    - cron: '20 12 * * *'  # 05:50 PM IST (Slot 5 Fallback)
    - cron: '50 14 * * *'  # 08:20 PM IST (Slot 6 Fallback)
  workflow_dispatch:        # Primary external trigger & manual UI trigger

permissions:
  contents: read
  actions: read

concurrency:
  group: scrape-tenders
  cancel-in-progress: false

env:
  NODE_ENV: production
  TZ: Asia/Kolkata
  MONGO_URI: ${{ secrets.MONGO_URI }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  SCRAPER_HEADLESS: 'true'

jobs:
  guard:
    name: 🛡️ Duplicate Execution Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check Recent Dispatches (for Schedule Fallback)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Direct dispatch or manual trigger detected. Proceeding unconditionally."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Scheduled cron fallback detected. Checking for recent dispatches in last 45 minutes..."
          RECENT_DISPATCH=$(gh run list \
            --workflow scrape-tenders.yml \
            --json databaseId,event,createdAt,status \
            --jq "[.[] | select(.event == \"workflow_dispatch\" and .databaseId != ($CURRENT_RUN_ID | tonumber) and ((now - (.createdAt | fromdateiso8601)) < 2700))] | length")

          if [ "$RECENT_DISPATCH" -gt 0 ]; then
            echo "Found $RECENT_DISPATCH recent workflow_dispatch run(s) within the last 45 minutes. Skipping fallback."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recent dispatch found within 45 minutes. Executing fallback ingestion."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  scrape-state:
    name: Scrape ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: jk
            name: "🏛️ Jammu & Kashmir"
          - state: punjab
            name: "🌾 Punjab"
          - state: hp
            name: "🏔️ Himachal Pradesh"
          - state: ladakh
            name: "🏔️ Ladakh"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright cache hit. Installing OS dependencies only..."
            npx playwright install-deps chromium
          else
            echo "Playwright cache miss. Installing browser and OS dependencies..."
            npx playwright install --with-deps chromium
          fi

      - name: Scrape Today's Tenders Across All Organisations
        id: run-scraper
        run: |
          cd backend
          node src/scripts/fetchTendersByDate.js --state ${{ matrix.state }} 2>&1 | tee ../scraper_${{ matrix.state }}.log

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### ${{ matrix.name }} Ingestion Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "scraper_${{ matrix.state }}.log" ]; then
            METRICS=$(grep -A 10 "INGESTION & DOCUMENT METRICS" "scraper_${{ matrix.state }}.log" || true)
            if [ -n "$METRICS" ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              echo "$METRICS" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Scan completed without metrics block." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No scraper log generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.state }}
          path: |
            scraper_${{ matrix.state }}.log
            backend/logs/
          retention-days: 3

  scrape-gem:
    name: Scrape 📦 GeM Multi-State
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright cache hit. Installing OS dependencies only..."
            npx playwright install-deps chromium
          else
            echo "Playwright cache miss. Installing browser and OS dependencies..."
            npx playwright install --with-deps chromium
          fi

      - name: Scrape Latest GeM Bids
        id: run-gem
        run: |
          cd backend
          node src/scripts/fetchGeMBids.js --state=ALL --pages 5 --limit 50 2>&1 | tee ../scraper_gem.log

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 📦 GeM Multi-State Bids Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "scraper_gem.log" ]; then
            TAIL_LOG=$(tail -n 15 "scraper_gem.log" || true)
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            echo "$TAIL_LOG" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No GeM log generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-gem
          path: |
            scraper_gem.log
            backend/logs/
          retention-days: 3
