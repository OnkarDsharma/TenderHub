name: Automated 6-Slot Multi-State Tender Ingestion

on:
  schedule:
    # 6 Human-Like Non-Round Office Hour Slots across the day (Asia/Kolkata IST)
    - cron: '54 2 * * *'   # 08:24 AM IST (Slot 1: Morning Opening)
    - cron: '43 5 * * *'   # 11:13 AM IST (Slot 2: Mid-Morning)
    - cron: '12 8 * * *'   # 01:42 PM IST (Slot 3: Post-Lunch)
    - cron: '48 10 * * *'  # 04:18 PM IST (Slot 4: Afternoon)
    - cron: '07 13 * * *'  # 06:37 PM IST (Slot 5: Late Office Hours)
    - cron: '41 15 * * *'  # 09:11 PM IST (Slot 6: Nightly Wrap-Up)
  workflow_dispatch:        # Primary external trigger & manual UI trigger

permissions:
  contents: read
  actions: read

concurrency:
  group: scrape-tenders
  cancel-in-progress: false

env:
  NODE_ENV: production
  TZ: Asia/Kolkata
  MONGO_URI: ${{ secrets.MONGO_URI }}
  # env.js validates the full application environment even for standalone scraper scripts.
  # These CI-only fallbacks satisfy validation when those services are not used by the scraper.
  REDIS_URL: ${{ secrets.REDIS_URL || 'redis://127.0.0.1:6379' }}
  JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET || 'github-actions-scraper-ci-access-secret' }}
  JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'github-actions-scraper-ci-refresh-secret' }}
  ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY || 'github-actions-scraper-ci-admin-secret' }}
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'scraper-ci@example.com' }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  SCRAPER_HEADLESS: 'true'

jobs:
  guard:
    name: 🛡️ Duplicate Execution Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check Recent Dispatches (for Schedule Fallback)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Direct dispatch or manual trigger detected. Proceeding unconditionally."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Scheduled cron fallback detected. Checking for recent dispatches in last 45 minutes..."
          RECENT_DISPATCH=0
          if command -v gh >/dev/null 2>&1; then
            RECENT_DISPATCH=$(gh run list \
              --repo "$GH_REPO" \
              --workflow scrape-tenders.yml \
              --json databaseId,event,createdAt,status \
              --jq "[.[] | select(.event == \"workflow_dispatch\" and .databaseId != ($CURRENT_RUN_ID | tonumber) and ((now - (.createdAt | fromdateiso8601)) < 2700))] | length" 2>/dev/null || echo 0)
          fi

          if [ "$RECENT_DISPATCH" -gt 0 ] 2>/dev/null; then
            echo "Found $RECENT_DISPATCH recent workflow_dispatch run(s) within the last 45 minutes. Skipping fallback."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No recent dispatch found within 45 minutes. Executing fallback ingestion."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  scrape-state:
    name: Scrape ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: jk
            name: "🏛️ Jammu & Kashmir"
          - state: punjab
            name: "🌾 Punjab"
          - state: hp
            name: "🏔️ Himachal Pradesh"
          - state: ladakh
            name: "🏔️ Ladakh"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright cache hit. Installing OS dependencies only..."
            npx playwright install-deps chromium
          else
            echo "Playwright cache miss. Installing browser and OS dependencies..."
            npx playwright install --with-deps chromium
          fi

      - name: Sweep Portal (Fix Extended Dates + Ingest Missing Tenders)
        id: run-scraper
        run: |
          cd backend
          # Reads every organisation's full listing, corrects corrigendum-extended dates, then ingests
          # tenders live on the portal but missing from the DB (newest first, incl. today's), capped per run.
          node src/scripts/fetchTendersByDate.js --state ${{ matrix.state }} --sweep --max-new 150 --max-minutes 80 2>&1 | tee ../scraper_${{ matrix.state }}.log

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### ${{ matrix.name }} Ingestion Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "scraper_${{ matrix.state }}.log" ]; then
            METRICS=$(grep -A 10 "INGESTION & DOCUMENT METRICS" "scraper_${{ matrix.state }}.log" || true)
            if [ -n "$METRICS" ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              echo "$METRICS" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Scan completed without metrics block." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No scraper log generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.state }}
          path: |
            scraper_${{ matrix.state }}.log
            backend/logs/
          retention-days: 3

  scrape-gem:
    name: Scrape 📦 GeM Multi-State
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright cache hit. Installing OS dependencies only..."
            npx playwright install-deps chromium
          else
            echo "Playwright cache miss. Installing browser and OS dependencies..."
            npx playwright install --with-deps chromium
          fi

      - name: Scrape Latest GeM Bids
        id: run-gem
        run: |
          cd backend
          # Full consignee-state listing for all 4 states + up to 150 new/changed PDFs.
          node src/scripts/fetchGeMBids.js --state=ALL --pdf-limit 150 --delay 800 2>&1 | tee ../scraper_gem.log

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 📦 GeM Multi-State Bids Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "scraper_gem.log" ]; then
            TAIL_LOG=$(tail -n 15 "scraper_gem.log" || true)
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            echo "$TAIL_LOG" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No GeM log generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-gem
          path: |
            scraper_gem.log
            backend/logs/
          retention-days: 3
