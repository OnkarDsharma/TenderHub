name: Automated Live Tender Ingestion

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Monday to Saturday) - Morning New Tenders Sweep
    - cron: '30 3 * * 1-6'
    # 13:00 UTC = 06:30 PM IST (Monday to Saturday) - Evening Wrap-up Sweep
    - cron: '0 13 * * 1-6'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  scrape-and-sync:
    name: Crawl Northern States & GeM Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 3. Install Dependencies & Playwright Chromium
        run: |
          cd backend
          npm ci
          npx playwright install --with-deps chromium

      - name: 4. Ingest Jammu & Kashmir Tenders
        continue-on-error: true
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SCRAPER_HEADLESS: 'true'
        run: |
          cd backend
          echo "🏛️ Ingesting Latest Jammu & Kashmir Tenders..."
          node src/scripts/fetchLatestDailyTenders.js 150

      - name: 5. Ingest Punjab Tenders
        continue-on-error: true
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SCRAPER_HEADLESS: 'true'
        run: |
          cd backend
          echo "🏛️ Ingesting Latest Punjab Tenders..."
          node src/scripts/fetchPunjabTenders.js 75

      - name: 6. Ingest Himachal Pradesh Tenders
        continue-on-error: true
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SCRAPER_HEADLESS: 'true'
        run: |
          cd backend
          echo "🏛️ Ingesting Latest Himachal Pradesh Tenders..."
          node src/scripts/fetchHPTenders.js 75

      - name: 7. Ingest GeM Multi-State Bids (J&K, HP, Punjab, Ladakh)
        continue-on-error: true
        env:
          NODE_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SCRAPER_HEADLESS: 'true'
        run: |
          cd backend
          echo "📦 Ingesting Latest GeM Bids across Northern States..."
          node src/scripts/fetchGeMBids.js --state=ALL --limit=60
