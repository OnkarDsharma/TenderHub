name: Automated Live Tender Ingestion

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Daily) - Morning New Tenders Sweep
    - cron: '30 3 * * *'
    # 08:30 UTC = 02:00 PM IST (Daily) - Midday Live Tenders Sweep
    - cron: '30 8 * * *'
    # 13:30 UTC = 07:00 PM IST (Daily) - Evening Wrap-up Sweep
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      limit_jk:
        description: 'Target Limit: Jammu & Kashmir Tenders'
        required: false
        default: '400'
      limit_punjab:
        description: 'Target Limit: Punjab Tenders'
        required: false
        default: '300'
      limit_hp:
        description: 'Target Limit: Himachal Pradesh Tenders'
        required: false
        default: '300'
      limit_gem:
        description: 'Target Limit: GeM Bids per State'
        required: false
        default: '150'
      sync_mode:
        description: 'Crawl Mode (LATEST: fast chronological live feed, DEPARTMENT: department traversal)'
        required: false
        default: 'LATEST'
        type: choice
        options:
          - LATEST
          - DEPARTMENT

env:
  NODE_ENV: production
  MONGO_URI: ${{ secrets.MONGO_URI }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-2.5-flash
  SCRAPER_HEADLESS: 'true'
  JWT_ACCESS_SECRET: 'thub_jwt_access_secret_32_chars_fallback'
  JWT_REFRESH_SECRET: 'thub_jwt_refresh_secret_32_chars_fallback'
  ADMIN_SECRET_KEY: 'admin_master_secret_thub_123'
  ADMIN_EMAIL: 'admin@tenderhub.in'

jobs:
  crawl-jk:
    name: 🏛️ Jammu & Kashmir Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies & Playwright
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium

      - name: Ingest Jammu & Kashmir Tenders
        run: |
          cd backend
          LIMIT="${{ inputs.limit_jk || '400' }}"
          MODE="${{ inputs.sync_mode || 'LATEST' }}"
          echo "🏛️ Ingesting Latest Jammu & Kashmir Tenders (Limit: $LIMIT, Mode: $MODE)..."
          node src/scripts/fetchLatestDailyTenders.js "$LIMIT" --mode="$MODE"

  crawl-punjab:
    name: 🌾 Punjab Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies & Playwright
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium

      - name: Ingest Punjab Tenders
        run: |
          cd backend
          LIMIT="${{ inputs.limit_punjab || '300' }}"
          MODE="${{ inputs.sync_mode || 'LATEST' }}"
          echo "🌾 Ingesting Latest Punjab Tenders (Limit: $LIMIT, Mode: $MODE)..."
          node src/scripts/fetchPunjabTenders.js "$LIMIT" --mode="$MODE"

  crawl-hp:
    name: 🏔️ Himachal Pradesh Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies & Playwright
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium

      - name: Ingest Himachal Pradesh Tenders
        run: |
          cd backend
          LIMIT="${{ inputs.limit_hp || '300' }}"
          MODE="${{ inputs.sync_mode || 'LATEST' }}"
          echo "🏔️ Ingesting Latest Himachal Pradesh Tenders (Limit: $LIMIT, Mode: $MODE)..."
          node src/scripts/fetchHPTenders.js "$LIMIT" --mode="$MODE"

  crawl-gem:
    name: 📦 GeM Multi-State Bids
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies & Playwright
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium

      - name: Ingest GeM Multi-State Bids
        run: |
          cd backend
          LIMIT="${{ inputs.limit_gem || '150' }}"
          echo "📦 Ingesting Latest GeM Bids across Northern States (Limit: $LIMIT)..."
          node src/scripts/fetchGeMBids.js --state=ALL --limit="$LIMIT"
