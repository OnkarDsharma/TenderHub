name: Automated 6-Slot Multi-State Tender Ingestion

on:
  schedule:
    # 6 Human-Like Office Hour Slots (Asia/Kolkata IST)
    - cron: '30 2 * * *'   # 08:00 AM IST (Slot 1)
    - cron: '30 4 * * *'   # 10:00 AM IST (Slot 2)
    - cron: '0 7 * * *'    # 12:30 PM IST (Slot 3)
    - cron: '30 9 * * *'   # 03:00 PM IST (Slot 4)
    - cron: '0 12 * * *'   # 05:30 PM IST (Slot 5)
    - cron: '30 14 * * *'  # 08:00 PM IST (Slot 6)
  workflow_dispatch:        # Allows manual 1-click trigger anytime from GitHub Actions UI

env:
  NODE_ENV: production
  MONGO_URI: ${{ secrets.MONGO_URI }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  SCRAPER_HEADLESS: 'true'

jobs:
  scrape-jk:
    name: 🏛️ Jammu & Kashmir Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Scrape Today's J&K Tenders Across All Organisations
        run: |
          cd backend
          node src/scripts/fetchTendersByDate.js --state jk

  scrape-punjab:
    name: 🌾 Punjab Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Scrape Today's Punjab Tenders Across All Organisations
        run: |
          cd backend
          node src/scripts/fetchTendersByDate.js --state punjab

  scrape-hp:
    name: 🏔️ Himachal Pradesh Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Scrape Today's Himachal Pradesh Tenders Across All Organisations
        run: |
          cd backend
          node src/scripts/fetchTendersByDate.js --state hp

  scrape-ladakh:
    name: 🏔️ Ladakh Tenders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Scrape Today's Ladakh Tenders Across All Organisations
        run: |
          cd backend
          node src/scripts/fetchTendersByDate.js --state ladakh

  scrape-gem:
    name: 📦 GeM Multi-State Bids
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies & Headless Chromium
        run: |
          cd backend
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Scrape Latest GeM Bids
        run: |
          cd backend
          node src/scripts/fetchGeMBids.js --state=ALL --pages 5 --limit 50
